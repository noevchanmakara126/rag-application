[project]
name = "rag-backend"
version = "0.1.0"
description = "FastAPI backend for the RAG test app — pgvector retrieval over a self-hosted, OpenAI-compatible LLM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.38.0",
    "sqlalchemy>=2.0.54",
    "alembic>=1.20.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    "pgvector>=0.4.1",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "pypdf>=6.0.0",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
